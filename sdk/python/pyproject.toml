[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deskcode"
version = "0.1.0"
description = "Python SDK for the DeskCode (desk) AI coding agent: one-shot runs and ACP sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Milorgs" }]
keywords = ["deskcode", "ai", "agent", "acp", "agent-client-protocol", "coding-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Milorgs/DeskCode"
Source = "https://github.com/Milorgs/DeskCode/tree/main/sdk/python"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskcode = ["py.typed"]
