name: Build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      DESK_NO_ARROW: 1
    strategy:
      matrix:
        mode: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libjson-c-dev libssl-dev libatspi2.0-dev libreadline-dev
      - name: Build and run tests
        run: |
          if [ '${{ matrix.mode }}' = sanitize ]; then
            make -j"$(nproc)" sanitize
          else
            make -j"$(nproc)" test
            make test-mcp-http
            PYTHONDONTWRITEBYTECODE=1 python3 -B bench/smoke_test.py
            PYTHONDONTWRITEBYTECODE=1 python3 -B action/tests/test_action.py
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=sdk/python/src:sdk/python/tests python3 -B -m unittest discover -s sdk/python/tests
            DESK_VSCODE_TEST_REAL=1 node editors/vscode/tests/test_vscode.js
            PYTHONDONTWRITEBYTECODE=1 python3 -B packaging/tests/test_packaging.py
            ./build/desk --version
            ./install.sh --prefix "$RUNNER_TEMP/desk-install"
            "$RUNNER_TEMP/desk-install/bin/desk" --version
          fi

      - name: Package Linux x64 executable and VS Code VSIX
        if: matrix.mode == 'release'
        run: |
          ver="$(./build/desk --version | tr -d '\r\n')"
          mkdir -p dist/desk-agent-linux-x64
          install -m 755 build/desk dist/desk-agent-linux-x64/desk
          strip dist/desk-agent-linux-x64/desk
          install -m 755 linux/install.sh dist/desk-agent-linux-x64/install.sh
          cp linux/README.txt dist/desk-agent-linux-x64/
          ldd dist/desk-agent-linux-x64/desk > dist/desk-agent-linux-x64/DEPENDENCIES.txt
          tar -C dist -czf dist/desk-agent-linux-x64.tar.gz desk-agent-linux-x64
          PYTHONDONTWRITEBYTECODE=1 python3 -B editors/vscode/package_vsix.py "dist/deskcode-vscode-${ver}.vsix"
          (cd dist && sha256sum desk-agent-linux-x64.tar.gz "deskcode-vscode-${ver}.vsix" > SHA256SUMS-linux.txt)
          mkdir -p "$RUNNER_TEMP/desk-package-check"
          tar -xzf dist/desk-agent-linux-x64.tar.gz -C "$RUNNER_TEMP/desk-package-check"
          sh "$RUNNER_TEMP/desk-package-check/desk-agent-linux-x64/install.sh" --prefix "$RUNNER_TEMP/desk-binary-install"
          "$RUNNER_TEMP/desk-binary-install/bin/desk" --version
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'release'
        with:
          name: desk-agent-linux-x64
          if-no-files-found: error
          path: |
            dist/desk-agent-linux-x64.tar.gz
            dist/deskcode-vscode-*.vsix
            dist/SHA256SUMS-linux.txt

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      DESK_NO_ARROW: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libjson-c-dev libssl-dev libatspi2.0-dev libreadline-dev
      - name: Build and run tests on ARM64
        run: |
          make -j"$(nproc)" test
          make test-mcp-http
          ./build/desk --version
      - name: Package Linux arm64 executable
        run: |
          mkdir -p dist/desk-agent-linux-arm64
          install -m 755 build/desk dist/desk-agent-linux-arm64/desk
          strip dist/desk-agent-linux-arm64/desk
          install -m 755 linux/install.sh dist/desk-agent-linux-arm64/install.sh
          cp linux/README.txt dist/desk-agent-linux-arm64/
          ldd dist/desk-agent-linux-arm64/desk > dist/desk-agent-linux-arm64/DEPENDENCIES.txt
          tar -C dist -czf dist/desk-agent-linux-arm64.tar.gz desk-agent-linux-arm64
          (cd dist && sha256sum desk-agent-linux-arm64.tar.gz > SHA256SUMS-linux-arm64.txt)
          mkdir -p "$RUNNER_TEMP/desk-package-check"
          tar -xzf dist/desk-agent-linux-arm64.tar.gz -C "$RUNNER_TEMP/desk-package-check"
          sh "$RUNNER_TEMP/desk-package-check/desk-agent-linux-arm64/install.sh" --prefix "$RUNNER_TEMP/desk-binary-install"
          "$RUNNER_TEMP/desk-binary-install/bin/desk" --version
      - uses: actions/upload-artifact@v4
        with:
          name: desk-agent-linux-arm64
          if-no-files-found: error
          path: |
            dist/desk-agent-linux-arm64.tar.gz
            dist/SHA256SUMS-linux-arm64.txt

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-x64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-x64-static-
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout db00e0c76ae37ede9464c157a3ec8653f8fbb494
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Build Windows x64
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          cmake -S . -B build/windows -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test Windows native behavior
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/windows/Release/desk.exe --version
          & ./build/windows/Release/desk.exe --lang en --help
      - name: Package Windows x64 executable
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desk-agent-windows-x64 | Out-Null
          Copy-Item build/windows/Release/desk.exe dist/desk-agent-windows-x64/
          Copy-Item windows/install.ps1,windows/README.txt dist/desk-agent-windows-x64/
          New-Item -ItemType Directory -Force dist/desk-agent-windows-x64/licenses | Out-Null
          Get-ChildItem build/windows/vcpkg_installed/x64-windows-static/share -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName 'copyright'
            if (Test-Path $copyright) { Copy-Item $copyright "dist/desk-agent-windows-x64/licenses/$($_.Name).txt" }
          }
          Compress-Archive -Path dist/desk-agent-windows-x64/* -DestinationPath dist/desk-agent-windows-x64.zip
          $digest = (Get-FileHash dist/desk-agent-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  desk-agent-windows-x64.zip" | Set-Content dist/SHA256SUMS-windows.txt -Encoding ASCII
          $version = (& dist/desk-agent-windows-x64/desk.exe --version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          & powershell -NoProfile -ExecutionPolicy Bypass -File dist/desk-agent-windows-x64/install.ps1 -Prefix "$env:RUNNER_TEMP/desk-install" -NoPath
          & "$env:RUNNER_TEMP/desk-install/desk.exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: desk-agent-windows-x64
          path: |
            dist/desk-agent-windows-x64.zip
            dist/SHA256SUMS-windows.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: windows-x64-static-${{ hashFiles('vcpkg.json') }}

  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-arm64-cache
          key: windows-arm64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-arm64-static-
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-arm64-cache" | Out-Null
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout db00e0c76ae37ede9464c157a3ec8653f8fbb494
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Build Windows ARM64
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-arm64-cache
        run: |
          cmake -S . -B build/windows-arm64 -A ARM64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-windows-static -DBUILD_TESTING=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows-arm64 --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify ARM64 PE header and package Windows ARM64 executable
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("build/windows-arm64/Release/desk.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw ("Expected ARM64 PE machine 0xAA64, got 0x{0:X4}" -f $machine) }
          New-Item -ItemType Directory -Force dist/desk-agent-windows-arm64 | Out-Null
          Copy-Item build/windows-arm64/Release/desk.exe dist/desk-agent-windows-arm64/
          Copy-Item windows/install.ps1,windows/README.txt dist/desk-agent-windows-arm64/
          New-Item -ItemType Directory -Force dist/desk-agent-windows-arm64/licenses | Out-Null
          Get-ChildItem build/windows-arm64/vcpkg_installed/arm64-windows-static/share -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName 'copyright'
            if (Test-Path $copyright) { Copy-Item $copyright "dist/desk-agent-windows-arm64/licenses/$($_.Name).txt" }
          }
          Compress-Archive -Path dist/desk-agent-windows-arm64/* -DestinationPath dist/desk-agent-windows-arm64.zip
          $digest = (Get-FileHash dist/desk-agent-windows-arm64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  desk-agent-windows-arm64.zip" | Set-Content dist/SHA256SUMS-windows-arm64.txt -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: desk-agent-windows-arm64
          path: |
            dist/desk-agent-windows-arm64.zip
            dist/SHA256SUMS-windows-arm64.txt
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/vcpkg-arm64-cache
          key: windows-arm64-static-${{ hashFiles('vcpkg.json') }}

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install json-c openssl@3 readline pkg-config
      - name: Build and run tests
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix json-c)/lib/pkgconfig"
          make -j4 test
          make test-mcp-http
          ./build/desk --version
      - name: Package Universal macOS (arm64 + x86_64) executable
        run: |
          JSONC_DIR="$(brew --prefix json-c)"
          OSSL_DIR="$(brew --prefix openssl@3)"
          RL_DIR="$(brew --prefix readline)"
          INC_FLAGS="-isystem $JSONC_DIR/include -isystem $JSONC_DIR/include/json-c -isystem $OSSL_DIR/include -isystem $RL_DIR/include -Isrc"

          rm -rf build "$RUNNER_TEMP/build-x64" "$RUNNER_TEMP/build-arm64"
          make -j4 build/desk \
            CXXFLAGS="-O2 -g -arch x86_64" \
            CPPFLAGS="$INC_FLAGS" \
            LDLIBS="$JSONC_DIR/lib/libjson-c.a $OSSL_DIR/lib/libssl.a $OSSL_DIR/lib/libcrypto.a $RL_DIR/lib/libreadline.a $RL_DIR/lib/libhistory.a -lcurl -lncurses"
          mkdir -p "$RUNNER_TEMP/build-x64" && cp build/desk "$RUNNER_TEMP/build-x64/desk"

          fetch_arm64_root() {
            python3 - "$1" "$2" "$RUNNER_TEMP/arm64-bottles/$1" <<'PY'
          import hashlib, json, os, pathlib, sys, tarfile, urllib.request
          pkg, archive, dest = sys.argv[1], sys.argv[2], sys.argv[3]
          os.makedirs(dest, exist_ok=True)
          meta = json.loads(urllib.request.urlopen(f"https://formulae.brew.sh/api/formula/{pkg}.json").read())
          files = meta["bottle"]["stable"]["files"]
          tag = next(t for t in ("arm64_sequoia", "arm64_sonoma", "arm64_ventura", "arm64_tahoe", "arm64_golden_gate") if t in files)
          entry = files[tag]
          req = urllib.request.Request(entry["url"], headers={"Authorization": "Bearer QQ=="})
          blob = urllib.request.urlopen(req).read()
          if hashlib.sha256(blob).hexdigest() != entry["sha256"]:
              raise SystemExit(f"SHA256 mismatch for {pkg} ({tag})")
          tgz = os.path.join(dest, "bottle.tar.gz")
          with open(tgz, "wb") as fh:
              fh.write(blob)
          with tarfile.open(tgz) as tf:
              tf.extractall(dest)
          matches = list(pathlib.Path(dest).rglob(archive))
          if not matches:
              raise SystemExit(f"Missing {archive} in {pkg} ({tag})")
          print(matches[0].parent.parent)
          PY
          }
          ARM_JSONC_ROOT="$(fetch_arm64_root json-c libjson-c.a)"
          ARM_OSSL_ROOT="$(fetch_arm64_root openssl@3 libssl.a)"
          ARM_RL_ROOT="$(fetch_arm64_root readline libreadline.a)"
          ARM_INC_FLAGS="-isystem $ARM_JSONC_ROOT/include -isystem $ARM_JSONC_ROOT/include/json-c -isystem $ARM_OSSL_ROOT/include -isystem $ARM_RL_ROOT/include -Isrc"

          rm -rf build
          make -j4 build/desk \
            CXXFLAGS="-O2 -g -arch arm64" \
            CPPFLAGS="$ARM_INC_FLAGS" \
            LDLIBS="$ARM_JSONC_ROOT/lib/libjson-c.a $ARM_OSSL_ROOT/lib/libssl.a $ARM_OSSL_ROOT/lib/libcrypto.a $ARM_RL_ROOT/lib/libreadline.a $ARM_RL_ROOT/lib/libhistory.a -lcurl -lncurses"
          mkdir -p "$RUNNER_TEMP/build-arm64" && cp build/desk "$RUNNER_TEMP/build-arm64/desk"

          mkdir -p dist/desk-agent-macos-universal
          lipo -create -output dist/desk-agent-macos-universal/desk "$RUNNER_TEMP/build-x64/desk" "$RUNNER_TEMP/build-arm64/desk"
          chmod 755 dist/desk-agent-macos-universal/desk
          strip -x dist/desk-agent-macos-universal/desk
          codesign --force --sign - dist/desk-agent-macos-universal/desk
          codesign --verify --verbose=2 dist/desk-agent-macos-universal/desk
          archs="$(lipo -archs dist/desk-agent-macos-universal/desk)"
          echo "Universal archs: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "Missing slice: $archs" >&2; exit 1 ;; esac
          otool -arch all -L dist/desk-agent-macos-universal/desk | tee dist/desk-agent-macos-universal/DEPENDENCIES.txt
          if grep -E '/opt/homebrew|/usr/local' dist/desk-agent-macos-universal/DEPENDENCIES.txt; then
            echo "Unexpected non-system dylib dependency on macOS binary" >&2
            exit 1
          fi
          install -m 755 macos/install.sh dist/desk-agent-macos-universal/install.sh
          cp macos/README.txt dist/desk-agent-macos-universal/
          tar -C dist -czf dist/desk-agent-macos-universal.tar.gz desk-agent-macos-universal
          (cd dist && shasum -a 256 desk-agent-macos-universal.tar.gz > SHA256SUMS-macos.txt)
          mkdir -p "$RUNNER_TEMP/desk-package-check"
          tar -xzf dist/desk-agent-macos-universal.tar.gz -C "$RUNNER_TEMP/desk-package-check"
          sh "$RUNNER_TEMP/desk-package-check/desk-agent-macos-universal/install.sh" --prefix "$RUNNER_TEMP/desk-binary-install"
          "$RUNNER_TEMP/desk-binary-install/bin/desk" --version
      - uses: actions/upload-artifact@v4
        with:
          name: desk-agent-macos-universal
          if-no-files-found: error
          path: |
            dist/desk-agent-macos-universal.tar.gz
            dist/SHA256SUMS-macos.txt

  release:
    needs: [test, linux-arm64, windows, windows-arm64, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-agent-*
          merge-multiple: true
          path: dist
      - name: Publish 5-platform packages, VS Code extension, and package manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESK_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v$DESK_VERSION"
          cat dist/SHA256SUMS-linux.txt dist/SHA256SUMS-linux-arm64.txt dist/SHA256SUMS-windows.txt dist/SHA256SUMS-windows-arm64.txt dist/SHA256SUMS-macos.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cp -r packaging "$RUNNER_TEMP/packaging"
          PYTHONDONTWRITEBYTECODE=1 python3 -B packaging/update_checksums.py "$DESK_VERSION" dist/SHA256SUMS.txt --packaging-dir "$RUNNER_TEMP/packaging"
          cp "$RUNNER_TEMP/packaging/scoop/deskcode.json" dist/deskcode.json
          cp "$RUNNER_TEMP/packaging/homebrew/deskcode.rb" dist/deskcode.rb
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published package."
          else
            gh release create "$tag" \
              dist/desk-agent-windows-x64.zip \
              dist/desk-agent-windows-arm64.zip \
              dist/desk-agent-linux-x64.tar.gz \
              dist/desk-agent-linux-arm64.tar.gz \
              dist/desk-agent-macos-universal.tar.gz \
              "dist/deskcode-vscode-${DESK_VERSION}.vsix" \
              dist/deskcode.json \
              dist/deskcode.rb \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "DeskCode $DESK_VERSION — Windows / Linux / macOS (x64 & ARM64)" \
              --notes-file "docs/releases/$tag.md"
          fi
